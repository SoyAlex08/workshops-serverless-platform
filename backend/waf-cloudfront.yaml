AWSTemplateFormatVersion: '2010-09-09'
Description: >
  WAFv2 WebACL for CloudFront (Scope=CLOUDFRONT). Must be deployed in us-east-1
  regardless of where the main workshops stack runs, per AWS WAF requirements.
  Deploy separately: sam deploy --template-file waf-cloudfront.yaml --region us-east-1

Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev

Resources:
  CloudFrontWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub workshops-cf-waf-${EnvName}
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub workshops-cf-waf-${EnvName}
      Rules:
        - Name: RateLimitRule
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CfRateLimitRule
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CfCommonRuleSet
      Tags:
        - Key: Project
          Value: Workshops
        - Key: Env
          Value: !Ref EnvName

Outputs:
  WebAclArn:
    Description: ARN of the CloudFront WebACL - pass as CloudFrontWebAclArn param to the main stack
    Value: !GetAtt CloudFrontWebAcl.Arn
    Export:
      Name: !Sub workshops-cf-waf-arn-${EnvName}
