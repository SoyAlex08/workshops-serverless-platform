name: Deploy Prod

# NOTE: automatic AWS deployment from CI is currently disabled — see the note
# in deploy-dev.yml. This workflow only runs tests; prod deploys are done
# manually via ./scripts/deploy-backend.sh prod and
# ./scripts/deploy-frontend.sh prod (see docs/despliegue.md).

on:
  push:
    tags:
      - 'v*'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/tests/requirements-test.txt
      - run: python -m pytest backend/tests/unit -v
