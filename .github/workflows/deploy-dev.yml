name: Deploy Dev

# NOTE: automatic AWS deployment from CI is currently disabled. The OIDC
# assume-role step (aws-actions/configure-aws-credentials) consistently fails
# with "Not authorized to perform sts:AssumeRoleWithWebIdentity" even against
# a freshly created, correctly-configured IAM role — the root cause wasn't
# found (see docs/despliegue.md). Until resolved, this workflow only runs
# tests; deploys are done manually via ./scripts/deploy-backend.sh and
# ./scripts/deploy-frontend.sh (see docs/despliegue.md).

on:
  push:
    branches: [dev]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install -r backend/tests/requirements-test.txt
      - name: Run unit tests
        run: python -m pytest backend/tests/unit -v
