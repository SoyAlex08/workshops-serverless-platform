name: Deploy Dev

on:
  push:
    branches: [dev]

permissions:
  id-token: write
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install -r backend/tests/requirements-test.txt
      - name: Run unit tests
        run: python -m pytest backend/tests/unit -v

  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    outputs:
      api-url: ${{ steps.outputs.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - uses: aws-actions/setup-sam@v2
      - name: sam build
        working-directory: backend
        run: sam build
      - name: sam deploy (dev)
        working-directory: backend
        run: >
          sam deploy --config-env dev --no-confirm-changeset --no-fail-on-empty-changeset
          --parameter-overrides EnvName=dev AlertEmail=${{ secrets.ALERT_EMAIL }}
      - name: Smoke test
        run: bash scripts/smoke-test.sh dev

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Deploy frontend
        run: bash scripts/deploy-frontend.sh dev
